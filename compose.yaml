name: nailroad-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nailroad
      POSTGRES_USER: nailroad
      POSTGRES_PASSWORD: local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nailroad
      DB_USERNAME: nailroad
      DB_PASSWORD: local-only
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?Set KAKAO_REST_API_KEY in .env}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?Set KAKAO_CLIENT_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/auth/kakao/callback}
      AUTH_FRONTEND_ORIGIN: ${AUTH_FRONTEND_ORIGIN:-}
      AUTH_SUCCESS_REDIRECT: ${AUTH_SUCCESS_REDIRECT:-/auth/login-complete}
      AUTH_FAILURE_REDIRECT: ${AUTH_FAILURE_REDIRECT:-/auth/login-failed}
      PHONE_VERIFICATION_MODE: ${PHONE_VERIFICATION_MODE:-disabled}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
