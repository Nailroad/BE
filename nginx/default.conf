# 정상 헬스체크만 접근 로그에서 제외합니다.
map "$uri:$status" $log_access {
    default 1;
    "/actuator/health:200" 0;
}

server {
    listen 80;
    server_name api.nailroad.site;

    # 인증서 발급과 갱신 요청은 HTTP로 받습니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://api.nailroad.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.nailroad.site;

    # 최초 발급이 끝난 인증서를 Compose의 certificates 볼륨에서 읽습니다.
    ssl_certificate /etc/letsencrypt/live/api.nailroad.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nailroad.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log main if=$log_access;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
    }
}
