name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nailroad
          POSTGRES_USER: nailroad
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nailroad -d nailroad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/nailroad
      DB_USERNAME: nailroad
      DB_PASSWORD: ci-only
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      KAKAO_REST_API_KEY: ci-kakao-key
      KAKAO_CLIENT_SECRET: ci-kakao-secret
      JWT_SECRET: ci-only-jwt-secret-32-bytes-minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Gradle 테스트 및 실행 JAR 생성
        run: |
          : "${AWS_REGION:?Set GitHub Actions variable AWS_REGION}"
          : "${S3_BUCKET:?Set GitHub Actions variable S3_BUCKET}"
          ./gradlew test bootJar --console=plain
      - name: Docker 이미지 빌드 확인
        if: github.event_name == 'pull_request'
        run: docker build -t nailroad-backend:ci .
      - name: 배포에 사용할 실행 JAR 업로드
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 1
