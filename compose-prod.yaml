name: nailroad

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-700m}
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?Set KAKAO_REST_API_KEY in .env}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?Set KAKAO_CLIENT_SECRET in .env}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?Set KAKAO_REDIRECT_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AUTH_SUCCESS_REDIRECT: ${AUTH_SUCCESS_REDIRECT:-/api/v1/auth/login-complete}
      AUTH_FAILURE_REDIRECT: ${AUTH_FAILURE_REDIRECT:-/api/v1/auth/login-failed}
      PHONE_VERIFICATION_MODE: ${PHONE_VERIFICATION_MODE:-disabled}
      COOLSMS_API_KEY: ${COOLSMS_API_KEY:-}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET:-}
      COOLSMS_SENDER: ${COOLSMS_SENDER:-}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    # 갱신된 인증서를 읽도록 주기적으로 설정을 검사하고 리로드합니다.
    command:
      - /bin/sh
      - -c
      - |
        while sleep 6h; do
          nginx -t && nginx -s reload
        done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - acme-webroot:/var/www/certbot:ro
      - certificates:/etc/letsencrypt:ro
    logging: *logging

  certbot:
    image: certbot/certbot:v5.10.0
    restart: unless-stopped
    # 수동 발급이나 dry-run은 compose run --entrypoint certbot으로 실행합니다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --quiet
          sleep 12h &
          wait "$$!"
        done
    volumes:
      - acme-webroot:/var/www/certbot
      - certificates:/etc/letsencrypt
    logging: *logging

volumes:
  acme-webroot:
    name: nailroad-acme-webroot
  certificates:
    name: nailroad-certificates
