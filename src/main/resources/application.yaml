spring:
  application:
    name: nailroad
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  juso:
    search-key: ${JUSO_SEARCH_API_KEY:}
    coordinate-key: ${JUSO_COORDINATE_API_KEY:}
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
